  // Parse <action> blocks out of an assistant reply and seed the message's
  // toolCalls array. Each call gets a stable id so the renderer can update
  // status in place as it transitions pending → running → done|failed.
  function parseToolCalls(content) {
    const calls = [];
    const matches = [...String(content || '').matchAll(ACTION_RE)];
    for (const m of matches) {
      let parsed;
      try { parsed = JSON.parse(m[1]); }
      catch (err) { calls.push({ id: 'tc_' + Math.random().toString(36).slice(2, 8), parseError: err.message, status: 'failed' }); continue; }
      calls.push({
        id: 'tc_' + Math.random().toString(36).slice(2, 8),
        target: parsed.target || 'browser',
        action: parsed.action || '(no action)',
        params: parsed.params || {},
        status: 'pending',
      });
    }
    return calls;
  }

  // Drive the assistant message's toolCalls through the bridge, mutating
  // status as we go and re-rendering between each so the user sees
  // pending → running → done/failed in real time.
  async function runBridgeActions(assistantMsg) {
    if (!assistantMsg.toolCalls || !assistantMsg.toolCalls.length) return null;
    const results = [];
    for (const tc of assistantMsg.toolCalls) {
      if (tc.parseError) {
        results.push({ ok: false, error: 'invalid action JSON: ' + tc.parseError });
        continue;
      }
      if (!tc.action || tc.action === '(no action)') {
        tc.status = 'failed'; tc.error = 'missing action field';
        results.push({ ok: false, error: tc.error });
        renderMessages();
        continue;
      }
      tc.status = 'running'; tc.startedAt = Date.now();
      renderMessages();
      try {
        const r = await bridgeCommand(tc.action, tc.params, { target: tc.target });
        tc.status = r?.ok === false ? 'failed' : 'done';
        tc.endedAt = Date.now();
        const sanitized = r?.data?.dataUrl
          ? { ...r, data: { ...r.data, dataUrl: '[screenshot captured, ' + Math.round(r.data.dataUrl.length / 1024) + 'kb]' } }
          : r;
        tc.result = sanitized;
        if (r?.error) tc.error = r.error;
        results.push(sanitized);
      } catch (err) {
        tc.status = 'failed'; tc.error = err.message; tc.endedAt = Date.now();
        results.push({ ok: false, error: err.message });
      }
      renderMessages();
    }
    return results;
  }

  bridgeConnect();

  /* Stale-model fallback. The PROXY (server.js) does a server-side retry with
   * gpt-oss:120b-cloud on any 400/404/422 from Ollama and tags the response
   * with x-claw-model-fallback / x-claw-model-used. We just read those
   * headers; no client-side retry needed. */
  const MODEL_FALLBACK = 'gpt-oss:120b-cloud';
  async function postWithModelFallback(body, signal) {
    const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ollama' };
    const original = body.model;
    const resp = await fetch(OLLAMA_URL, { method: 'POST', headers, body: JSON.stringify(body), signal });
    const fbHeader = resp.headers.get('x-claw-model-fallback');
    const usedHeader = resp.headers.get('x-claw-model-used') || MODEL_FALLBACK;
    if (fbHeader) {
      return { resp, model: usedHeader, fellBack: true, originalModel: fbHeader };
    }
    return { resp, model: original, fellBack: false };
  }

  /* ============================================================
     SESSION OPS
     ============================================================ */
  function switchSession(id) {
    state.activeSessionId = id;
    persist();
    const s = activeSession();
    document.getElementById('sessionTitle').value = s.title;
    document.getElementById('modelSelect').value = s.model || DEFAULT_MODEL;
    renderSessions();
    renderMessages();
  }
  function newSession() {
    const s = seedSession(`session ${state.sessions.length + 1}`);
    s.model = document.getElementById('modelSelect').value;
    state.sessions.unshift(s);
    state.activeSessionId = s.id;
    persist();
    renderSessions();
    renderMessages();
    document.getElementById('sessionTitle').value = s.title;
    document.getElementById('prompt').focus();
    toast('New session');
  }
  function renameSession(id) {
    const s = state.sessions.find(x => x.id === id);
    const next = prompt('Rename session', s.title);
    if (next && next.trim()) {
      s.title = next.trim();
      persist();
      renderSessions();
      if (id === state.activeSessionId) document.getElementById('sessionTitle').value = s.title;
    }
  }
  function deleteSession(id) {
    if (state.sessions.length <= 1) return toast('Keep at least one session.');
    if (!confirm('Delete this session?')) return;
    state.sessions = state.sessions.filter(s => s.id !== id);
    if (state.activeSessionId === id) state.activeSessionId = state.sessions[0].id;
    persist();
    renderSessions();
    switchSession(state.activeSessionId);
  }
  function showSessionMenu(id, x, y) {
    // Tiny in-place menu for right-click.
    document.querySelectorAll('.ctx-menu').forEach(n => n.remove());
    const menu = document.createElement('div');
    menu.className = 'ctx-menu fixed z-50 border shadow-edge';
    menu.style.cssText = `top:${y}px;left:${x}px;background:var(--bg-elev-2);border-color:var(--border-strong);min-width:140px;`;
    menu.innerHTML = `
      <button class="block w-full text-left px-3 py-2 text-sm hover:bg-ink-700" data-act="rename" style="color: var(--fg);">Rename</button>
      <button class="block w-full text-left px-3 py-2 text-sm hover:bg-ink-700" data-act="delete" style="color: var(--rust-400, #c8553d);">Delete</button>
    `;
    document.body.appendChild(menu);
    menu.querySelector('[data-act="rename"]').onclick = () => { renameSession(id); menu.remove(); };
    menu.querySelector('[data-act="delete"]').onclick = () => { deleteSession(id); menu.remove(); };
    setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 0);

  /* ============================================================
     CHAT — actually streams from Ollama.
     ============================================================ */
  async function send() {
    if (state.streaming) return;
    const promptEl = document.getElementById('prompt');
    const text = promptEl.value.trim();
    if (!text) return;
    const sess = activeSession();
    sess.model = document.getElementById('modelSelect').value;
    let dispatchModel = resolveModel(sess.model, text, state.pendingAttachments);
    sess.lastAt = Date.now();

    // Auto-title from first user message.
    if (sess.messages.length === 0 && /untitled|session \d+|welcome to claw/i.test(sess.title)) {
      sess.title = text.slice(0, 48) + (text.length > 48 ? '…' : '');
      document.getElementById('sessionTitle').value = sess.title;
    }

    const userMsg = { role: 'user', content: text };
    if (state.pendingAttachments.length) {
      userMsg.attachments = state.pendingAttachments;
      state.pendingAttachments = [];
      renderPendingAttachments();
    }
    sess.messages.push(userMsg);
    promptEl.value = '';
    autoresize();
    updateTokenCount();

    const assistantMsg = { role: 'assistant', content: '', streaming: true, model: dispatchModel, requestedModel: sess.model };
    sess.messages.push(assistantMsg);
    renderMessages();
    renderSessions();
    persist();

    const messages = buildPayloadMessages(sess);
    state.streaming = true;
    state.abortCtrl = new AbortController();
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.textContent = 'Stop';
    sendBtn.classList.remove('bg-ember-500', 'hover:bg-ember-400');
    sendBtn.classList.add('bg-rust-500', 'hover:bg-rust-400');

    try {
      const result = await postWithModelFallback(
        { model: dispatchModel, messages, stream: true },
        state.abortCtrl.signal,
      );
      const resp = result.resp;
      if (result.fellBack) {
        toast(`"${result.originalModel}" not available — switched to ${result.model} and pinned this session to auto.`);
        sess.model = 'auto';
        document.getElementById('modelSelect').value = 'auto';
        assistantMsg.model = result.model;
        assistantMsg.requestedModel = 'auto';
        dispatchModel = result.model;
        renderSessions();
      }

      if (!resp.ok) {
        throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      const messagesEl = document.getElementById('messages');
      const userScrolledUp = () => messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight > 80;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line.startsWith('data:')) continue;
          const payload = line.slice(5).trim();
          if (payload === '[DONE]') break;
          try {
            const obj = JSON.parse(payload);
            const delta = obj.choices?.[0]?.delta?.content || '';
            if (delta) {
              assistantMsg.content += delta;
              scheduleStreamUpdate(assistantMsg);
            }
          } catch (e) { /* ignore partial JSON */ }
        }
      }
      assistantMsg.streaming = false;
      renderMessages();

      // Browser bridge — execute any <action>...</action> blocks the model emitted.
      // Loop up to 5 turns so multi-step plans complete without manual re-prompting.
      let loopGuard = 5;
      let lastMsg = assistantMsg;
      while (loopGuard-- > 0 && (bridge.executors.extension === 'connected' || bridge.executors.desktop === 'connected')) {
        lastMsg.toolCalls = parseToolCalls(lastMsg.content);
        renderMessages();
        const results = await runBridgeActions(lastMsg);
        if (!results || results.length === 0) break;
        const feedback = `BRIDGE RESULTS:\n` + results.map((r, i) => `[${i + 1}] ${JSON.stringify(r).slice(0, 600)}`).join('\n');
        sess.messages.push({ role: 'user', content: feedback, bridgeFeedback: true });
        const followAssistant = { role: 'assistant', content: '', streaming: true, model: dispatchModel, requestedModel: sess.model };
        sess.messages.push(followAssistant);
        renderMessages();
        const followMessages = buildPayloadMessages(sess);
        const fr = await postWithModelFallback(
          { model: dispatchModel, messages: followMessages, stream: true },
          state.abortCtrl?.signal,
        );
        const followResp = fr.resp;
        if (fr.fellBack) {
          toast(`"${fr.originalModel}" not available — switched to ${fr.model}.`);
          dispatchModel = fr.model;
          followAssistant.model = fr.model;
        }
        if (!followResp.ok) { followAssistant.error = `HTTP ${followResp.status}`; followAssistant.streaming = false; renderMessages(); break; }
        const reader2 = followResp.body.getReader();
        const dec2 = new TextDecoder();
        let buf2 = '';
        while (true) {
          const { value, done } = await reader2.read();
          if (done) break;
          buf2 += dec2.decode(value, { stream: true });
          let nl;
          while ((nl = buf2.indexOf('\n')) >= 0) {
            const line = buf2.slice(0, nl).trim();
            buf2 = buf2.slice(nl + 1);
            if (!line.startsWith('data:')) continue;
            const payload = line.slice(5).trim();
            if (payload === '[DONE]') break;
            try {
              const obj = JSON.parse(payload);
              const delta = obj.choices?.[0]?.delta?.content || '';
              if (delta) { followAssistant.content += delta; scheduleStreamUpdate(followAssistant); }
            } catch { /* ignore */ }
          }
        }
        followAssistant.streaming = false;
        renderMessages();
        lastMsg = followAssistant;
      }
    } catch (err) {
      assistantMsg.streaming = false;
      const msg = err.name === 'AbortError'
        ? '(stopped)'
        : (err.message.includes('Failed to fetch')
            ? `Could not reach the server. If running locally, start it with \`cd web && npm start\`. If deployed, check that OLLAMA_API_KEY is set in Railway → Variables.`
            : err.message);
      assistantMsg.error = msg;
      renderMessages();
    } finally {
      state.streaming = false;
      state.abortCtrl = null;
      sendBtn.textContent = 'Send';
      sendBtn.classList.add('bg-ember-500', 'hover:bg-ember-400');
      sendBtn.classList.remove('bg-rust-500', 'hover:bg-rust-400');
      sess.lastAt = Date.now();
      persist();
      renderSessions();
    }
  }

  function stopStreaming() {
    if (state.abortCtrl) state.abortCtrl.abort();
  }

  function buildPayloadMessages(sess) {
    const out = [];
    const agent = state.agents.find(a => a.active);
    const enabledSkills = state.skills.filter(s => s.enabled);
    let sys = agent ? agent.systemPrompt : '';
    if (enabledSkills.length) {
      const skillNote = `\n\nActive skills available to you (UI scaffolding — invoke conceptually): ${enabledSkills.map(s => s.name).join(', ')}.`;
      sys = (sys || 'You are a helpful local assistant.') + skillNote;
    }
    if (bridge.executors.extension === 'connected' || bridge.executors.desktop === 'connected') {
      sys = (sys || 'You are a helpful local assistant.') + bridgeSystemPrompt();
    }
    const memPrompt = buildMemoryPrompt();
    if (memPrompt) sys = (sys || 'You are a helpful local assistant.') + memPrompt;
    if (sys) out.push({ role: 'system', content: sys });
    sess.messages
      .filter(m => !m.error && (m.content || (m.attachments && m.attachments.length)))
      .forEach(m => {
        if (m.role === 'user' && m.attachments?.length) {
          out.push({ role: 'user', content: buildUserContent(m) });
        } else {
          out.push({ role: m.role, content: m.content });
        }
      });
    return out;
  }

  /* ============================================================
     UTILITIES
     ============================================================ */
  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function renderMarkdown(src) {
    if (!src) return '';
    try {
      marked.setOptions({ breaks: true, gfm: true });
      return marked.parse(src);
    } catch {
      return escapeHtml(src);
    }
  }
  function autoresize() {
    const el = document.getElementById('prompt');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  }
  function updateTokenCount() {
    const text = document.getElementById('prompt').value;
    // Rough heuristic — 1 token ≈ 4 chars.
    const tok = Math.max(0, Math.round(text.length / 4));
    document.getElementById('tokenCount').textContent = `~${tok} tok`;
  }
  function toast(msg) {
    const wrap = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast-enter px-4 py-2 text-sm font-mono border shadow-edge';
    el.style.cssText = 'background: var(--bg-elev-2); border-color: var(--border-strong); color: var(--fg);';
    el.textContent = msg;
    wrap.appendChild(el);
    requestAnimationFrame(() => el.classList.add('toast-show'));
    setTimeout(() => {
      el.classList.remove('toast-show');
      el.classList.add('toast-enter');
      setTimeout(() => el.remove(), 300);
    }, 2400);
  }

  /* ============================================================
     EVENT WIRING
     ============================================================ */
  function wire() {
    // Sidebar collapse.
    document.getElementById('toggleLeft').addEventListener('click', () => {
      state.leftCollapsed = !state.leftCollapsed;
      document.getElementById('leftSidebar').classList.toggle('collapsed-l', state.leftCollapsed);
    });
    document.getElementById('toggleRight').addEventListener('click', () => {
      state.rightCollapsed = !state.rightCollapsed;
      document.getElementById('rightSidebar').classList.toggle('collapsed-r', state.rightCollapsed);
    });

    document.getElementById('newSessionBtn').addEventListener('click', newSession);

    document.getElementById('sessionTitle').addEventListener('change', e => {
      const sess = activeSession();
      sess.title = e.target.value.trim() || 'untitled';
      persist();
      renderSessions();
    });

    document.getElementById('modelSelect').addEventListener('change', e => {
      const sess = activeSession();
      sess.model = e.target.value;
      persist();
    });

    document.getElementById('themeToggle').addEventListener('click', () => {
      const cur = document.documentElement.classList.contains('light') ? 'light' : 'dark';
      applyTheme(cur === 'light' ? 'dark' : 'light');
    });

    document.getElementById('cmdPaletteBtn').addEventListener('click', () => openPalette());
    document.getElementById('settingsBtn').addEventListener('click', () => {
      toast('Settings live in the right panel for now.');
    });
    const fileInput = document.getElementById('fileInput');
    document.getElementById('attachBtn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      if (e.target.files?.length) await addFiles([...e.target.files]);
      e.target.value = '';
    });

    // Drag & drop anywhere in the chat surface
    const dropZone = document.body;
    let dragDepth = 0;
    dropZone.addEventListener('dragenter', (e) => {
      if (!e.dataTransfer?.types?.includes('Files')) return;
      e.preventDefault();
      dragDepth++;
      document.getElementById('composeBox')?.style.setProperty('border-color', 'var(--accent)');
    });
    dropZone.addEventListener('dragover', (e) => {
      if (e.dataTransfer?.types?.includes('Files')) e.preventDefault();
    });
    dropZone.addEventListener('dragleave', () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) document.getElementById('composeBox')?.style.setProperty('border-color', 'var(--border-strong)');
    });
    dropZone.addEventListener('drop', async (e) => {
      if (!e.dataTransfer?.files?.length) return;
      e.preventDefault();
      dragDepth = 0;
      document.getElementById('composeBox')?.style.setProperty('border-color', 'var(--border-strong)');
      await addFiles([...e.dataTransfer.files]);
    });

    // Paste image from clipboard
    document.addEventListener('paste', async (e) => {
      const items = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file');
      if (!items.length) return;
      const files = items.map(i => i.getAsFile()).filter(Boolean);
      if (files.length) {
        e.preventDefault();
        await addFiles(files);
      }
    });

    // Tabs.
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.rightTab = tab.dataset.tab;
        renderRight();
      });
    });

    // Prompt.
    const promptEl = document.getElementById('prompt');
    promptEl.addEventListener('input', () => { autoresize(); updateTokenCount(); });
    promptEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        send();
      }
    });

    // Send button doubles as Stop while streaming.
    document.getElementById('sendBtn').addEventListener('click', () => {
      if (state.streaming) stopStreaming();
      else send();
    });

    // Global shortcuts.
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        openPalette();
      }
      if ((e.metaKey || e.ctrlKey) && e.key === '/') {
        e.preventDefault();
        openPalette();
      }
      if ((e.metaKey || e.ctrlKey) && (e.key === 'n' || e.key === 'N')) {
        e.preventDefault();
        newSession();
      }
      if (e.key === 'Escape') {
        if (state.streaming) stopStreaming();
        document.querySelectorAll('.ctx-menu').forEach(n => n.remove());
        const modal = document.querySelector('#modalRoot .modal-bg');
        if (modal) document.getElementById('modalRoot').innerHTML = '';
      }
    });

    // Periodic re-render of running jobs (elapsed time tick).
    setInterval(() => {
      if (state.jobs.some(j => j.status === 'running')) renderJobs();
    }, 1000);
  }

  /* ============================================================
     COMMAND PALETTE — ⌘K / ⌘/
     ============================================================ */
  function getPaletteCommands() {
    const cmds = [];
    const tabsList = ['agents', 'memory', 'skills', 'browser', 'integrations'];

    // Top-level actions
    cmds.push(
      { label: 'New session', cat: 'session', keys: '⌘N', run: () => newSession() },
      { label: 'Rename current session', cat: 'session', run: () => document.getElementById('sessionTitle')?.focus() },
      { label: 'Stop streaming', cat: 'session', keys: 'Esc', run: () => state.streaming && stopStreaming() },
      { label: 'Toggle theme (dark / light)', cat: 'theme', run: () => {
        const cur = document.documentElement.classList.contains('light') ? 'light' : 'dark';
        applyTheme(cur === 'light' ? 'dark' : 'light');
      }},
    );

    // Right-panel tabs
    for (const t of tabsList) {
      cmds.push({ label: `Open ${t} panel`, cat: 'panel', keywords: 'tab right', run: () => { state.rightTab = t; renderRight(); } });
    }

    // Models — auto + every cloud model, by category label
    cmds.push({ label: 'Switch model → auto', cat: 'model', run: () => setModel('auto') });
    for (const m of CLOUD_MODELS) {
      cmds.push({ label: `Switch model → ${m.id}`, cat: m.cat + ' model', keywords: m.desc, run: () => setModel(m.id) });
    }

    // Sessions — switch to any
    for (const s of state.sessions) {
      if (s.id === state.activeSessionId) continue;
      cmds.push({
        label: `Switch session → ${s.title || 'untitled'}`,
        cat: 'session',
        keywords: (s.messages || []).slice(-1)[0]?.content?.slice(0, 80) || '',
        run: () => switchSession(s.id),
      });
    }

    // Agents — activate
    for (const a of state.agents || []) {
      cmds.push({
        label: `Activate agent → ${a.name}${a.active ? ' (active)' : ''}`,
        cat: 'agent',
        keywords: a.description || '',
        run: () => {
          state.agents.forEach(x => x.active = (x.id === a.id));
          persist();
          renderActiveChips();
          if (state.rightTab === 'agents') renderRight();
        },
      });
    }

    // Skills — toggle each
    for (const s of state.skills || []) {
      cmds.push({
        label: `Toggle skill → ${s.name} (${s.enabled ? 'on' : 'off'})`,
        cat: 'skill',
        keywords: s.description || '',
        run: () => {
          s.enabled = !s.enabled; persist(); renderActiveChips();
          if (state.rightTab === 'skills') renderRight();
        },
      });
    }

    // Browser bridge actions
    cmds.push(
      { label: 'Bridge → copy pairing token', cat: 'bridge', run: () => navigator.clipboard.writeText(bridgeToken()).then(() => toast('Token copied.')) },
      { label: 'Bridge → take browser screenshot', cat: 'bridge', run: async () => {
        try { const r = await bridgeCommand('screenshot'); toast(r?.data?.dataUrl ? 'Screenshot captured.' : 'No screenshot.'); }
        catch (err) { toast(err.message); }
      }},
      { label: 'Bridge → take desktop screenshot', cat: 'bridge', run: async () => {
        try { const r = await bridgeCommand('screenshot', {}, { target: 'desktop' }); toast(r?.data?.dataUrl ? 'Desktop screenshot.' : 'No screenshot.'); }
        catch (err) { toast(err.message); }
      }},
    );

    // Auto-approve toggles
    for (const cat of ['shell','fs','registry','services','playwright','gbrain']) {
      cmds.push({
        label: `Auto-approve → toggle ${cat} (${bridge.autoApprove[cat] ? 'on' : 'off'})`,
        cat: 'auto-approve',
        run: () => {
          bridge.autoApprove[cat] = !bridge.autoApprove[cat];
          localStorage.setItem('clawcode.autoApprove.v1', JSON.stringify(bridge.autoApprove));
          sendAutoApprove();
          if (state.rightTab === 'browser') renderRight();
          toast(`auto-approve ${cat}: ${bridge.autoApprove[cat] ? 'ON' : 'off'}`);
        },
      });
    }

    // Open external
    cmds.push(
      { label: 'Open → GitHub repo', cat: 'open', run: () => window.open('https://github.com/ZENSEE1314/clawcode/tree/web-ui', '_blank', 'noopener') },
      { label: 'Open → Railway dashboard', cat: 'open', run: () => window.open('https://railway.com/dashboard', '_blank', 'noopener') },
      { label: 'Open → Ollama Cloud models', cat: 'open', run: () => window.open('https://ollama.com/search?c=cloud', '_blank', 'noopener') },
      { label: 'Open → NotebookLM', cat: 'open', run: () => window.open('https://notebooklm.google.com/', '_blank', 'noopener') },
    );

    // Memory
    cmds.push(
      { label: 'Memory → clear all', cat: 'memory', run: () => {
        if (!confirm('Clear all memory? This cannot be undone.')) return;
        state.memory = { aboutMe: '', projects: '', notes: '' };
        persist();
        if (state.rightTab === 'memory') renderRight();
        toast('Memory cleared.');
      }},
    );

    return cmds;
  }

  function setModel(id) {
    document.getElementById('modelSelect').value = id;
    const sess = activeSession();
    sess.model = id; persist(); renderSessions();
    toast(`Model: ${id}`);
  }

  // Lightweight fuzzy score: lowercase substring across label + cat + keywords.
  function paletteScore(cmd, q) {
    if (!q) return 1;
    const hay = (cmd.label + ' ' + cmd.cat + ' ' + (cmd.keywords || '')).toLowerCase();
    let lastIdx = -1, score = 0;
    for (const ch of q) {
      const i = hay.indexOf(ch, lastIdx + 1);
      if (i === -1) return 0;
      score += i === lastIdx + 1 ? 2 : 1;       // contiguous bonus
      if (lastIdx === -1 && i < 5) score += 3;  // early-prefix bonus
      lastIdx = i;
    }
    return score / hay.length + score;
  }

  function openPalette() {
    if (document.getElementById('cmdPalette')) return;
    const all = getPaletteCommands();
    let filtered = all;
    let selected = 0;

    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div id="cmdPalette" class="modal-bg fixed inset-0 z-[60] flex items-start justify-center pt-[15vh] p-4" role="dialog" aria-modal="true" aria-label="Command palette">
        <div class="w-full max-w-xl border" style="border-color: var(--border-strong); background: var(--bg-elev-1); box-shadow: 0 24px 60px -10px rgba(0,0,0,0.6);">
          <div class="flex items-center gap-2 px-3 py-2.5 border-b" style="border-color: var(--border-strong);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--accent);" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="paletteInput" type="text" autocomplete="off" placeholder="type a command…" class="w-full bg-transparent outline-none text-sm font-mono" style="color: var(--fg);" />
            <kbd class="text-[10px] font-mono px-1.5 py-0.5 border" style="border-color: var(--border-strong); color: var(--fg-dim);">esc</kbd>
          </div>
          <ul id="paletteList" class="max-h-[50vh] overflow-y-auto"></ul>
          <div class="px-3 py-2 border-t flex items-center gap-3 text-[10px] font-mono" style="border-color: var(--border-strong); color: var(--fg-dim);">
            <span><kbd>↑</kbd><kbd>↓</kbd> nav</span>
            <span><kbd>↵</kbd> run</span>
            <span><kbd>esc</kbd> close</span>
            <span class="ml-auto" id="paletteCount"></span>
          </div>
        </div>
      </div>
    `;
    const overlay = document.getElementById('cmdPalette');
    const input   = document.getElementById('paletteInput');
    const list    = document.getElementById('paletteList');
    const count   = document.getElementById('paletteCount');

    function render() {
      list.innerHTML = filtered.length ? filtered.map((c, i) => `
        <li data-idx="${i}" class="px-3 py-2 cursor-pointer flex items-center gap-3 border-l-2 ${i === selected ? 'bg-ink-700' : ''}" style="border-color: ${i === selected ? 'var(--accent)' : 'transparent'};">
          <span class="text-[9.5px] font-mono uppercase tracking-widest w-20 truncate" style="color: var(--fg-dim);">${escapeHtml(c.cat)}</span>
          <span class="flex-1 text-[13px]" style="color: var(--fg);">${escapeHtml(c.label)}</span>
          ${c.keys ? `<kbd class="text-[10px] font-mono px-1.5 py-0.5 border" style="border-color: var(--border-strong); color: var(--fg-dim);">${escapeHtml(c.keys)}</kbd>` : ''}
        </li>
      `).join('') : `<li class="px-3 py-6 text-center text-[12px]" style="color: var(--fg-dim);">no commands match</li>`;
      count.textContent = `${filtered.length} of ${all.length}`;
      const sel = list.querySelector(`[data-idx="${selected}"]`);
      if (sel) sel.scrollIntoView({ block: 'nearest' });
    }

    function filter(q) {
      const query = q.trim().toLowerCase();
      filtered = all
        .map(c => ({ c, s: paletteScore(c, query) }))
        .filter(x => x.s > 0)
        .sort((a, b) => b.s - a.s)
        .map(x => x.c);
      selected = 0;
      render();
    }

    function close() { root.innerHTML = ''; }

    function run(idx) {
      const cmd = filtered[idx];
      if (!cmd) return;
      close();
      try { cmd.run(); } catch (err) { toast(`failed: ${err.message}`); }
    }

    input.addEventListener('input', e => filter(e.target.value));
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown')      { e.preventDefault(); selected = Math.min(selected + 1, filtered.length - 1); render(); }
      else if (e.key === 'ArrowUp')   { e.preventDefault(); selected = Math.max(selected - 1, 0); render(); }
      else if (e.key === 'Enter')     { e.preventDefault(); run(selected); }
      else if (e.key === 'Escape')    { e.preventDefault(); close(); }
    });
    list.addEventListener('mousemove', e => {
      const li = e.target.closest('li[data-idx]');
      if (!li) return;
      const i = Number(li.dataset.idx);
      if (i !== selected) { selected = i; render(); }
    });
    list.addEventListener('click', e => {
      const li = e.target.closest('li[data-idx]');
      if (li) run(Number(li.dataset.idx));
    });
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

    filter('');
    setTimeout(() => input.focus(), 0);
  }

  /* ============================================================
     BOOT
     ============================================================ */
  // Populate the model datalist from CLOUD_MODELS, grouped by category.
  // Hoisted via function declaration so boot() can call it.
  function populateModelDatalist() {
    const dl = document.getElementById('modelList');
    if (!dl) return;
    const cats = ['general', 'reasoning', 'coder', 'vision', 'small-fast', 'multilingual'];
    const opts = cats.flatMap(cat =>
      (MODEL_BY_CAT[cat] || []).map(id => `<option value="${id}">${cat} — ${id}</option>`)
    );
    dl.innerHTML = '<option value="auto">auto — pick per message</option>' + opts.join('');
  }

  function boot() {
    load();
    populateModelDatalist();
    const sess = activeSession();
    document.getElementById('sessionTitle').value = sess.title;
    document.getElementById('modelSelect').value = sess.model || DEFAULT_MODEL;
    wire();
    renderSessions();
    renderJobs();
    renderMessages();
    renderRight();
    renderActiveChips();
    autoresize();
    updateTokenCount();
  }

  document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
